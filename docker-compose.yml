# Dayfold local orchestration.
#
# Brings up Postgres (stateful) and the Hocuspocus sync service. The Next.js web
# app runs locally via `npm run dev` (a Dockerfile exists for it but is unused in
# dev). Values are read from the repo-root .env (see .env.example).
#
#   docker compose up -d
#   npm run db:migrate && npm run db:seed && npm run dev
#
# Tip: when actively developing the sync service (Phase 5+), stop the `sync`
# container and run `npm run dev:sync` locally for hot reload.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayfold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dayfold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayfold}
      POSTGRES_DB: ${POSTGRES_DB:-dayfold}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dayfold} -d ${POSTGRES_DB:-dayfold}']
      interval: 5s
      timeout: 5s
      retries: 10

  sync:
    build:
      context: .
      dockerfile: apps/sync/Dockerfile
    container_name: dayfold-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNC_PORT: 1234
      SYNC_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-dayfold}:${POSTGRES_PASSWORD:-dayfold}@postgres:5432/${POSTGRES_DB:-dayfold}
      SYNC_SHARED_SECRET: ${SYNC_SHARED_SECRET:-dev-insecure-sync-secret-change-me}
    ports:
      - '${SYNC_PORT:-1234}:1234'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:1234/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
